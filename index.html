<title>Ridester</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f2f2f5,#141416);--ink:light-dark(#1c1c1e,#f2f2f4);--mute:light-dark(#6b6b73,#a1a1aa);--card:light-dark(rgba(255,255,255,.85),rgba(38,38,42,.85));--line:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.12))}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 80% -10%,light-dark(#ffe9bf,#3a2a0c),transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
form{width:min(380px,100%);background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 50px -24px rgba(0,0,0,.45)}
.brand{display:inline-flex;align-items:flex-start;line-height:1}.word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;letter-spacing:-.092em}.star{width:.58em;height:.58em;font-size:44px;margin:.04em 0 0 .15em}
p{color:var(--mute);margin:8px 0 18px}label{font-size:13px;font-weight:600;color:var(--mute)}
input[type=password]{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:light-dark(#fff,#1f1f23);color:var(--ink);margin:6px 0 12px}
input:focus-visible,button:focus-visible{outline:3px solid #f5a524;outline-offset:2px}
.rm{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:16px}.rm input{width:20px;height:20px;accent-color:#f5a524}
button{width:100%;min-height:46px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffbe45,#f5a524);color:#2a1a00;font:inherit;font-weight:700;cursor:pointer}
.err{color:light-dark(#b3261e,#ff8a80);font-weight:600;min-height:1.5em;margin:10px 0 0;font-size:14px}
</style></head><body>

  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(D.s), iterations: D.n, hash: 'SHA-256' }, k0, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(D.i) }, k, u(D.c)));
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = 'Openen…';
  const pw = document.getElementById('pw').value;
  try { if (document.getElementById('rm').checked) try { localStorage.setItem('ridester.pw', pw); } catch (x) {}
    await open(pw); }
  catch (x) { err.textContent = 'Wachtwoord klopt niet.'; try { localStorage.removeItem('ridester.pw'); } catch (y) {} }
});
let saved = null; try { saved = localStorage.getItem('ridester.pw'); } catch (x) {}
if (saved) open(saved).catch(() => { try { localStorage.removeItem('ridester.pw'); } catch (y) {} });
}
